name: Docs freshness
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare live docs with docs-snapshot/
        id: check
        run: python3 scripts/check_docs.py | tee check.log
        continue-on-error: true
      - name: Open an issue when the docs changed
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Docs changed: re-verify SKILL.md ($(date -u +%Y-%m-%d))"
          if gh issue list --state open --search "\"Docs changed\" in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "an open docs-changed issue already exists"; exit 0
          fi
          gh issue create --title "$title" --body-file check.log --label docs
      - name: Fail the job when the docs changed
        if: steps.check.outcome == 'failure'
        run: exit 1
